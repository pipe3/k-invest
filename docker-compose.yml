services:
  k-invest:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY}
      - GOOGLE_CX_ID=${GOOGLE_CX_ID}
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - PORTFOLIO_FILE=/data/portfolio.json
      - HISTORY_FILE=/data/history.json
      - PODCAST_WATCHLIST_FILE=/data/doppelgaenger_watchlist.json
      - PODCAST_HISTORY_FILE=/data/podcast_history.json
      - PODCAST_JOB_FILE=/data/podcast_job.json
      - DEPOT_JOB_FILE=/data/depot_job.json
      - SETTINGS_FILE=/data/settings.json
      - DISCOVERY_HISTORY_FILE=/data/discovery_history.json
      - DISCOVERY_JOB_FILE=/data/discovery_job.json
    restart: unless-stopped
