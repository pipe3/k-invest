services:
  k-invest:
    build: .
    ports:
      - "8501:8501"
    volumes:
      - ./portfolio.json:/app/portfolio.json
      - ./history.json:/app/history.json
      - ./doppelgaenger_watchlist.json:/app/doppelgaenger_watchlist.json
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
    restart: unless-stopped
