services:
  k-invest:
    build:
      context: https://github.com/pipe3/k-invest.git
      dockerfile: Dockerfile
    ports:
      - "8501:8501"
    volumes:
      - k-invest-data:/data
    environment:
      - ANTHROPIC_API_KEY=sk-ant-DEIN-KEY-HIER
      - YOUTUBE_API_KEY=DEIN-YOUTUBE-KEY-HIER
      - PORTFOLIO_FILE=/data/portfolio.json
      - HISTORY_FILE=/data/history.json
      - PODCAST_WATCHLIST_FILE=/data/doppelgaenger_watchlist.json
      - PODCAST_HISTORY_FILE=/data/podcast_history.json
      - PODCAST_JOB_FILE=/data/podcast_job.json
      - DEPOT_JOB_FILE=/data/depot_job.json
    restart: unless-stopped

volumes:
  k-invest-data:
